# Projecta — Base Compose topology
# Defines: service names, internal ports, networks, volumes, health checks,
# service dependencies, and stable environment-variable contract.
# Do NOT put local-only or production-only overrides here.
# See: docs/initialization/08-Deployment-Choice.md §5

name: projecta

services:
  jena:
    profiles: ["tools"]
    build:
      context: ./infra/docker/fuseki
      args:
        JENA_VERSION: "6.2.0"
    image: projecta-jena:6.2.0
    working_dir: /data
    volumes:
      - ./ontology:/data:ro
      - ./scripts:/scripts:ro
      - jena-data:/var/lib/fuseki
    environment:
      FUSEKI_BASE: /var/lib/fuseki

  ontology-test:
    profiles: ["tools"]
    build:
      context: ./infra/docker/fuseki
      args:
        JENA_VERSION: "6.2.0"
    image: projecta-jena:6.2.0
    working_dir: /data
    volumes:
      - ./ontology:/data:ro
      - ./scripts:/scripts:ro
    entrypoint:
      - uv
      - run
      - --offline
      - --script
      - /scripts/validate_ontology.py
      - /data

  fuseki:
    build:
      context: ./infra/docker/fuseki
      args:
        JENA_VERSION: "6.2.0"
    image: projecta-fuseki:6.2.0
    command:
      - ./fuseki-server
      - --config
      - /config/fuseki-config.ttl
      - --quiet
    volumes:
      - fuseki-data:/var/lib/fuseki
      - ./infra/docker/fuseki/config/fuseki-config.ttl:/config/fuseki-config.ttl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3030/$$/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  fuseki-bootstrap:
    image: projecta-fuseki:6.2.0
    depends_on:
      fuseki:
        condition: service_healthy
    working_dir: /data
    volumes:
      - ./ontology:/data:ro
      - ./scripts:/scripts:ro
    entrypoint:
      - uv
      - run
      - --offline
      - python
      - /scripts/bootstrap_fuseki.py
    environment:
      FUSEKI_DATASET_URL: http://fuseki:3030/projecta
      PROJECTA_BOOTSTRAP_ACCEPTANCE_PROJECTS: ${PROJECTA_BOOTSTRAP_ACCEPTANCE_PROJECTS:-}
    restart: "no"

  semantic-core:
    build:
      context: ./services/semantic-core
      target: runtime
    image: projecta-semantic-core:local
    depends_on:
      fuseki-bootstrap:
        condition: service_completed_successfully
    environment:
      FUSEKI_BASE_URL: http://fuseki:3030/projecta
    volumes:
      - ./ontology:/ontology:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  connector-postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${PROJECTA_CONNECTOR_POSTGRES_USER:?PROJECTA_CONNECTOR_POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${PROJECTA_CONNECTOR_POSTGRES_PASSWORD:?PROJECTA_CONNECTOR_POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${PROJECTA_CONNECTOR_POSTGRES_DB:?PROJECTA_CONNECTOR_POSTGRES_DB must be set}
    volumes:
      - projecta-connector-postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -q"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  connector-migrate:
    build:
      context: ./apps/api
      target: runtime
    image: projecta-api:local
    depends_on:
      connector-postgres:
        condition: service_healthy
    command: ["python", "-m", "projecta_api.operational.migrate", "upgrade"]
    environment:
      PROJECTA_CONNECTOR_DATABASE_HOST: connector-postgres
      PROJECTA_CONNECTOR_DATABASE_PORT: "5432"
      PROJECTA_CONNECTOR_DATABASE_NAME: ${PROJECTA_CONNECTOR_POSTGRES_DB:?PROJECTA_CONNECTOR_POSTGRES_DB must be set}
      PROJECTA_CONNECTOR_DATABASE_USER: ${PROJECTA_CONNECTOR_POSTGRES_USER:?PROJECTA_CONNECTOR_POSTGRES_USER must be set}
      PROJECTA_CONNECTOR_DATABASE_PASSWORD: ${PROJECTA_CONNECTOR_POSTGRES_PASSWORD:?PROJECTA_CONNECTOR_POSTGRES_PASSWORD must be set}
      PROJECTA_EVIDENCE_ROOT: /var/lib/projecta/evidence
    restart: "no"

  api:
    build:
      context: ./apps/api
      target: runtime
    image: projecta-api:local
    depends_on:
      semantic-core:
        condition: service_healthy
      connector-postgres:
        condition: service_healthy
      connector-migrate:
        condition: service_completed_successfully
    environment:
      PROJECTA_API_SEMANTIC_CORE_URL: http://semantic-core:8080
      PROJECTA_API_TRUSTED_CONTEXT_SECRET: ${PROJECTA_API_TRUSTED_CONTEXT_SECRET:?PROJECTA_API_TRUSTED_CONTEXT_SECRET must be set}
      PROJECTA_API_RUNTIME_MODE: ${PROJECTA_API_RUNTIME_MODE:-headless}
      PROJECTA_CONNECTOR_LOCAL_ADMIN_ENABLED: ${PROJECTA_CONNECTOR_LOCAL_ADMIN_ENABLED:-false}
      PROJECTA_API_OPERATIONAL_DATABASE_PATH: /var/lib/projecta/operational.db
      PROJECTA_CONNECTOR_DATABASE_HOST: connector-postgres
      PROJECTA_CONNECTOR_DATABASE_PORT: "5432"
      PROJECTA_CONNECTOR_DATABASE_NAME: ${PROJECTA_CONNECTOR_POSTGRES_DB:?PROJECTA_CONNECTOR_POSTGRES_DB must be set}
      PROJECTA_CONNECTOR_DATABASE_USER: ${PROJECTA_CONNECTOR_POSTGRES_USER:?PROJECTA_CONNECTOR_POSTGRES_USER must be set}
      PROJECTA_CONNECTOR_DATABASE_PASSWORD: ${PROJECTA_CONNECTOR_POSTGRES_PASSWORD:?PROJECTA_CONNECTOR_POSTGRES_PASSWORD must be set}
      PROJECTA_EVIDENCE_ROOT: /var/lib/projecta/evidence
      PROJECTA_API_SECRET_STORE_MASTER_KEY: ${PROJECTA_API_SECRET_STORE_MASTER_KEY:?PROJECTA_API_SECRET_STORE_MASTER_KEY must be set}
      PROJECTA_API_EXPERIENCE_ACTOR_ID: ${PROJECTA_API_EXPERIENCE_ACTOR_ID:-}
      PROJECTA_API_EXPERIENCE_PROJECT_CATALOG: ${PROJECTA_API_EXPERIENCE_PROJECT_CATALOG:-}
      PROJECTA_LLM_TYPE: ${PROJECTA_LLM_TYPE:-}
      PROJECTA_LLM_BASE_URL: ${PROJECTA_LLM_BASE_URL:-}
      PROJECTA_LLM_API_KEY: ${PROJECTA_LLM_API_KEY:-}
      PROJECTA_LLM_MODEL: ${PROJECTA_LLM_MODEL:-}
    volumes:
      - projecta-api-operational:/var/lib/projecta
      - projecta-evidence:/var/lib/projecta/evidence
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health/ready').status == 200"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  web:
    profiles: ["web"]
    build:
      context: ./apps/web
      target: runtime
    image: projecta-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PROJECTA_WEB_PORT:-3000}:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  semantic-core-system-test:
    profiles: ["system-test"]
    build:
      context: ./services/semantic-core
      target: development
    image: projecta-semantic-core:system-test
    command: ["mvn", "--batch-mode", "-Dspotless.check.skip=true", "verify"]
    depends_on:
      semantic-core-runtime-test:
        condition: service_started
    environment:
      FUSEKI_BASE_URL: http://fuseki:3030/projecta
      SEMANTIC_CORE_HTTP_URL: http://semantic-core-runtime-test:8080
    volumes:
      - ./ontology:/ontology:ro
    restart: "no"

  semantic-core-runtime-test:
    profiles: ["system-test"]
    build:
      context: ./services/semantic-core
      target: runtime
    image: projecta-semantic-core:runtime-test
    depends_on:
      fuseki-bootstrap:
        condition: service_completed_successfully
    environment:
      FUSEKI_BASE_URL: http://fuseki:3030/projecta
      SEMANTIC_CORE_TRUSTED_PROJECT_ID: ecommerce-checkout
      SEMANTIC_CORE_TRUSTED_ACTOR_ID: le
    volumes:
      - ./ontology:/ontology:ro
    restart: "no"

  m4-fixture-loader:
    profiles: ["system-test"]
    image: projecta-fuseki:6.2.0
    depends_on:
      fuseki-bootstrap:
        condition: service_completed_successfully
    working_dir: /data
    volumes:
      - ./ontology:/data:ro
      - ./scripts:/scripts:ro
    entrypoint:
      - uv
      - run
      - --offline
      - --with
      - rdflib==7.6.0
      - python
      - /scripts/load_m4_fixture.py
    environment:
      FUSEKI_DATASET_URL: http://fuseki:3030/projecta
    restart: "no"

  api-runtime-test:
    profiles: ["system-test"]
    build:
      context: ./apps/api
      target: test
    image: projecta-api:runtime-test
    command: ["uv", "run", "uvicorn", "system_app:app", "--app-dir", "/app/tests", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      connector-postgres:
        condition: service_healthy
      semantic-core-runtime-test:
        condition: service_healthy
      m4-fixture-loader:
        condition: service_completed_successfully
    environment:
      PROJECTA_API_SEMANTIC_CORE_URL: http://semantic-core-runtime-test:8080
      PROJECTA_API_TRUSTED_CONTEXT_SECRET: ${PROJECTA_API_TRUSTED_CONTEXT_SECRET:?PROJECTA_API_TRUSTED_CONTEXT_SECRET must be set}
      PROJECTA_CONNECTOR_DATABASE_HOST: connector-postgres
      PROJECTA_CONNECTOR_DATABASE_PORT: "5432"
      PROJECTA_CONNECTOR_DATABASE_NAME: ${PROJECTA_CONNECTOR_POSTGRES_DB:?PROJECTA_CONNECTOR_POSTGRES_DB must be set}
      PROJECTA_CONNECTOR_DATABASE_USER: ${PROJECTA_CONNECTOR_POSTGRES_USER:?PROJECTA_CONNECTOR_POSTGRES_USER must be set}
      PROJECTA_CONNECTOR_DATABASE_PASSWORD: ${PROJECTA_CONNECTOR_POSTGRES_PASSWORD:?PROJECTA_CONNECTOR_POSTGRES_PASSWORD must be set}
      PROJECTA_LLM_TYPE: openai-response
      PROJECTA_LLM_BASE_URL: https://system-test.invalid
      PROJECTA_LLM_API_KEY: system-test-not-a-secret
      PROJECTA_LLM_MODEL: replay:basic-requirement-001
      PROJECTA_REPLAY_FIXTURE: /evaluation/sprint-5/replay_outputs.v1.json
    volumes:
      - ./evaluation:/evaluation:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health/ready').status == 200"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: "no"

  api-system-test:
    profiles: ["system-test"]
    build:
      context: ./apps/api
      target: test
    image: projecta-api:system-test
    command: ["uv", "run", "pytest", "-q", "-m", "not local_contract"]
    depends_on:
      api-runtime-test:
        condition: service_healthy
    environment:
      PROJECTA_API_HTTP_URL: http://api-runtime-test:8000
      PROJECTA_API_CONTEXT_SECRET: ${PROJECTA_API_TRUSTED_CONTEXT_SECRET:?PROJECTA_API_TRUSTED_CONTEXT_SECRET must be set}
      PROJECTA_M3_E2E: "1"
      PROJECTA_REPLAY_FIXTURE: /evaluation/sprint-5/replay_outputs.v1.json
    volumes:
      - ./evaluation:/evaluation:ro
    restart: "no"

  connector-operational-test:
    profiles: ["system-test"]
    build:
      context: ./apps/api
      target: test
    image: projecta-api:connector-operational-test
    depends_on:
      connector-migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "pytest", "-q", "tests/test_connector_postgres_integration.py"]
    environment:
      PROJECTA_CONNECTOR_INTEGRATION: "1"
      PROJECTA_CONNECTOR_DATABASE_HOST: connector-postgres
      PROJECTA_CONNECTOR_DATABASE_PORT: "5432"
      PROJECTA_CONNECTOR_DATABASE_NAME: ${PROJECTA_CONNECTOR_POSTGRES_DB:?PROJECTA_CONNECTOR_POSTGRES_DB must be set}
      PROJECTA_CONNECTOR_DATABASE_USER: ${PROJECTA_CONNECTOR_POSTGRES_USER:?PROJECTA_CONNECTOR_POSTGRES_USER must be set}
      PROJECTA_CONNECTOR_DATABASE_PASSWORD: ${PROJECTA_CONNECTOR_POSTGRES_PASSWORD:?PROJECTA_CONNECTOR_POSTGRES_PASSWORD must be set}
    restart: "no"

volumes:
  jena-data:
  fuseki-data:
  projecta-api-operational:
  projecta-connector-postgres:
  projecta-evidence:
