# Projecta — Local development overrides
# Published debug ports, dev image targets, Compose Watch / hot reload,
# seed data, developer-friendly logging.
# Merge: docker compose -f compose.yaml -f compose.dev.yaml config
# See: docs/initialization/08-Deployment-Choice.md §5

services:
  jena:
    ports:
      - "3030:3030"

  semantic-core:
    ports:
      - "8080:8080"
    environment:
      SEMANTIC_CORE_LOG_LEVEL: DEBUG

  api:
    build:
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/src
    environment:
      PROJECTA_API_SEMANTIC_CORE_URL: http://semantic-core:8080
