status = error
name = ProjectaFusekiLogging

appender.console.type = Console
appender.console.name = STDERR
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5p %-15c{1} :: %m%n

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = STDERR

logger.fuseki-http.name = org.apache.jena.fuseki.Fuseki
logger.fuseki-http.level = WARN

logger.fuseki-request.name = org.apache.jena.fuseki.Request
logger.fuseki-request.level = OFF
