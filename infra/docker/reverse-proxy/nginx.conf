# Fixed public protocol surface. Management, health, metrics, and arbitrary
# host forwarding remain private and are not routed through this edge.
events {}
  http {
  upstream projecta_api { server api:8000; }
  upstream projecta_web { server web:8080; }
  upstream keycloak { server keycloak:8443; }

  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 443 ssl;
    server_name projecta.example.com;
    ssl_certificate /etc/nginx/tls/projecta.crt;
    ssl_certificate_key /etc/nginx/tls/projecta.key;
    proxy_set_header Host projecta.example.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host projecta.example.com;
    proxy_set_header X-Forwarded-For $remote_addr;
    location /auth/callback { proxy_pass http://projecta_api; }
    location /auth/login { proxy_pass http://projecta_api; }
    location /auth/logout { proxy_pass http://projecta_api; }
    location /v1/ { proxy_pass http://projecta_api; }
    location /health/live { proxy_pass http://projecta_api; }
    location / { proxy_pass http://projecta_web; }
  }

  server {
    listen 443 ssl;
    server_name auth.example.com;
    ssl_certificate /etc/nginx/tls/auth.crt;
    ssl_certificate_key /etc/nginx/tls/auth.key;
    proxy_set_header Host auth.example.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host auth.example.com;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    location = /realms/projecta/.well-known/openid-configuration { proxy_pass https://keycloak; }
    location ^~ /realms/projecta/protocol/openid-connect/ { proxy_pass https://keycloak; }
    location / { return 404; }
  }
}
