server {
    listen 8080;
    server_name _;

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # Extraction permits three bounded 60-second provider attempts. Keep
        # the proxy open long enough for the API to return its sanitized JSON
        # result or problem response instead of replacing it with a 504 page.
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    location /health/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
