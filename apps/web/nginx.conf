map $http_x_request_id $projecta_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

map $http_x_operation_id $projecta_operation_id {
    default $http_x_operation_id;
    ""      $request_id;
}

map $uri $projecta_route_class {
    default "unknown";
    ~^/v1/quick-notes "note.capture";
    ~^/v1/candidates "candidate.lifecycle";
    ~^/v1/knowledge-items "knowledge.query";
    ~^/v1/project-context "project.context";
    ~^/v1/entities "graph.projection";
    ~^/v1/inference "inference.rebuild";
    ~^/health/live "health.live";
    ~^/health/ready "health.ready";
}

log_format projecta_json escape=json
    '{"schemaVersion":"s8.logging.v1","event":"request.completed",'
    '"service":"nginx","boundary":"proxy",'
    '"requestId":"$projecta_request_id","operationId":"$projecta_operation_id",'
    '"routeClass":"$projecta_route_class","method":"$request_method",'
    '"status":$status,"requestTimeSeconds":"$request_time",'
    '"upstreamStatus":"$upstream_status","upstreamTime":"$upstream_response_time",'
    '"upstreamAddress":"$upstream_addr","connection":"$connection"}';

access_log /dev/stdout projecta_json;
error_log /dev/stderr warn;

server {
    listen 8080;
    server_name _;

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $projecta_request_id;
        proxy_set_header X-Operation-Id $projecta_operation_id;
        error_page 504 = @api_proxy_timeout;
    }

    location @api_proxy_timeout {
        internal;
        default_type application/problem+json;
        add_header X-Request-Id $projecta_request_id always;
        return 504 '{"type":"https://w3id.org/projecta/problems/infrastructure-proxy-timeout","title":"Infrastructure timeout","status":504,"code":"INFRASTRUCTURE_TIMEOUT","detail":"The API proxy did not receive a response before its deadline.","requestId":"$projecta_request_id"}';
    }

    location /health/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $projecta_request_id;
        proxy_set_header X-Operation-Id $projecta_operation_id;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
