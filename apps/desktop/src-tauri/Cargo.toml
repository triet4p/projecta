[package]
name = "projecta-desktop"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "projecta_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "projecta-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "=1.0.228", features = [] }
serde_json = { version = "=1.0.149", features = [] }
url = { version = "=2.5.8" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
