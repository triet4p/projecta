[project]
name = "projecta-api"
version = "0.5.0"
description = "Projecta application API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "cryptography>=44,<47",
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "openai>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.14,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.52,<1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "local_contract: repository-source contract checks excluded from container runtime suites",
    "postgres_integration: tests requiring the Compose PostgreSQL connector dependency",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests"]
executionEnvironments = [{ root = "src" }]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnusedFunction = false
