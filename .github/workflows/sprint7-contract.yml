name: Sprint 7 contract and quality gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    # Linux runners cannot write the deployment default /var/lib/projecta/evidence
    # (LocalEvidenceStore mkdir at import). Keep the deployment default unchanged;
    # use github.workspace for this job's owned evidence directory.
    env:
      PROJECTA_EVIDENCE_ROOT: ${{ github.workspace }}/projecta-evidence
      PROJECTA_API_RUNTIME_MODE: headless
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --locked --all-groups
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/web
      - run: npm run check:api-drift
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: uv run ruff check .
        working-directory: apps/api
      - run: uv run pyright
        working-directory: apps/api
      - run: uv run pytest -q
        working-directory: apps/api
